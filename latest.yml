releaseNotes: |
  - Automatic updates: new versions download by themselves and you only click "Restart & update"
  - Open any file (PDF, picture, PSD, CDR, PLT, DXF), change its width × height in the status bar and Export as JPG, PNG, PDF, SVG, WEBP, DXF or PLT
  - Size lock in the status bar: change width and height together (locked) or separately (unlocked), in size or %
  - Multiple Copies: new toolbar - Flip horizontal / vertical, Rotate sheet, Resize all images by %
  - Print: Mirror (reverse) image and Reverse page order
  - A cut file is no longer needed to export from Multiple Copies
